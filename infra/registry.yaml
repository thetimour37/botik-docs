units:
  - id: repo-botik
    type: repository
    name: "botik (код)"
    purpose: "Исходный код бота Анастасия"
    projects: [botik]
    connects_to: [railway-botik]
    access: [Тимур]
    description: >
      GitHub thetimour37/botik, ветка master. Railway задеплоен по push в эту
      ветку. Локально: C:\Users\user\projects\botik. Push в master — только по
      явному решению пользователя (не автоматически).
    status: active
    owner: Тимур
    updated: 2026-09-15

  - id: repo-botik-docs
    type: repository
    name: "botik-docs (документация)"
    purpose: "Бэклог, методология, спецификация поведения бота, продуктовые материалы"
    projects: [botik]
    connects_to: [jarvis]
    access: [Тимур, "Jarvis (deploy key, запись)"]
    description: >
      GitHub thetimour37/botik-docs (private), ветка main. Локально — внутри
      Obsidian-хранилища: C:\Users\user\Documents\Obsidian Vault\Obsidian
      Vault\Ботик\botik-docs. Синхронизация с GitHub проверяется ежедневно в
      9:00 (Windows Task Scheduler, scripts/check-sync.ps1). spec/ содержит
      актуальную (август 2026) концепцию продукта. У Jarvis есть deploy key
      с правом записи (настроен в GitHub → Settings → Deploy keys) — приватный
      ключ хранится на стороне Jarvis, вне этого проекта.
    status: active
    owner: Тимур
    updated: 2026-09-02

  - id: railway-botik
    type: service
    name: "Railway — botik"
    purpose: "Хостинг worker-процесса бота (Procfile: worker: python main.py)"
    projects: [botik]
    connects_to: [db-botik-pg]
    access: [Тимур]
    description: >
      PaaS-хостинг, автодеплой по push в repo-botik@master (настройка
      автодеплоя — в панели Railway, не в коде репозитория). Переменные
      окружения: TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, DATABASE_PUBLIC_URL,
      ADMIN_IDS (с 2026-10-14: id администраторов через запятую, открывает
      служебные команды /debug, /simulate*, /resetonboarding). Зависимости —
      requirements.txt (Railway ставит при сборке); с 2026-10-14 (итерация 8)
      добавлен matplotlib — графики недельного резюме рисуются в PNG без
      дисплея (backend Agg), новых переменных окружения не требуется.
      Необязательные переменные новой логики (итерация 7): SILENCE_DAYS и
      MAX_SILENCE_CHECKS (по умолчанию 3/3). Итерация 11: новых переменных нет;
      массовый перевод пользователей на новую логику — из бота командой
      /resetv2 all или `railway run python scripts/reset_to_v2.py --all-legacy`
      (dry-run, затем --apply). v2.1.0 (2026-10-15): новых переменных нет;
      версия бота — `version.py`, описание релиза для отчёта о запуске —
      `release_notes/vX.Y.Z.md` в репозитории бота; в БД новая таблица bot_meta.
      v2.2.0 (2026-10-15): переработка спеки, поведение бота не менялось;
      новых переменных окружения нет.
    status: active
    owner: Тимур
    updated: 2026-10-15

  - id: db-botik-pg
    type: service
    name: "PostgreSQL (Railway)"
    hosted_on: railway-botik
    purpose: "Хранение пользователей, диалогов, профилей, итогов рефлексии (daily/weekly/monthly/yearly summaries)"
    projects: [botik]
    access: [Тимур]
    description: >
      Подключение через переменную окружения DATABASE_PUBLIC_URL, доступ из
      кода через asyncpg-пул (database.py). С 2026-10-14 схема расширена
      (database_v2.py): колонки новой логики в users (flow_version, bot_mode,
      engagement_state и др.), таблицы requests, focuses, request_scores,
      sessions, fsm_storage; затем (итерации 5–10) observations, future_topics,
      session_messages, monthly_summaries и колонки этапов вечера, субботы,
      месячного среза. Бэкапы строк перед сбросом — users_backup_ГГГГММДД_ЧЧММСС
      (своя таблица на каждый сброс, в том числе массовый /resetv2 all).
      Локально DATABASE_PUBLIC_URL не задана: прямого доступа к боевой БД с
      рабочей машины нет.
    status: active
    owner: Тимур
    updated: 2026-10-14

  - id: bot-anastasia
    type: telegram_bot
    name: "Анастасия"
    hosted_on: railway-botik
    purpose: "Психологический коуч-бот для осознанной рефлексии"
    projects: [botik]
    connects_to: [db-botik-pg, api-anthropic]
    access: [Тимур, Анастасия]
    description: >
      aiogram 3. С 2026-10-14 (итерация 11 PLAN.md — переключение) основная
      логика — новая (режим 2, «осознанная рефлексия», handlers/*.py):
      онбординг и контракт (вечер 18:00–22:30, по умолчанию 20:00), запрос и
      оценка 1–10, фокус недели, ежедневный сбор наблюдений (отражение на
      первые 3 в день, дальше 👍), вечернее резюме пн–пт, машина молчания
      (active/checking/paused/dormant), суббота 9:00 GMT+3 — недельное резюме
      со звёздочками и графиком (matplotlib), выбор фокуса, сессия с психологом
      (час), месячный срез в первую субботу месяца, команды /focus,
      /dashboard (текст + график), /session, /pause, /settings. Старая логика
      (v1, main.py) остаётся для пользователей с flow_version=1 до массового
      перевода (/resetv2 all) и для служебного режима 1 (bot_mode='free');
      её удаление — итерация 12.
      Исторически: FSM-логика и обработчики v1 в main.py, планировщик v1
      (вечерняя рефлексия, недельные/месячные/годовые итоги, молчание, полночь).
      Токен — TELEGRAM_BOT_TOKEN (Railway env). Переименование бота
      запланировано, но не выполнено (backlog 1.5, устаревшая концепция).
      Служебные команды (/debug, /simulate*, /resetonboarding) доступны только
      id из ADMIN_IDS (с 2026-10-14). С 2026-10-14 (итерация 2 PLAN.md) две
      логики в одном процессе: старая (v1, существующие пользователи) и новая
      (v2, handlers/v2.py — новые пользователи с flow_version=2); планировщик
      v1 работает только со старой логикой. FSM хранится в PostgreSQL
      (таблица fsm_storage). Меню команд задаётся из кода (services/menu.py,
      при запуске): по умолчанию — меню режима 2 (/focus, /dashboard,
      /session, /pause, /settings, /rules, /help, /support), если в БД не
      осталось flow_version=1, иначе старое (/rules, /help, /support);
      пользователям v2 — меню режима 2 на их чат. BotFather вручную не
      настраивается. Админ-команды: /setmode2all, /resetv2 [id …],
      /resetv2 all (массовый перевод, итерация 11), /profile и /profileupdate,
      /simulateweek и /simulatemonth (для v2). Отчёт админам при запуске
      показывает, сколько пользователей ещё на старой логике.
      Планировщик v2 (каждую минуту, опрос БД): срок Блока 2
      (trigger_block2_deadlines), утро пн–пт 9:00 (trigger_morning_messages),
      вечер по контракту (trigger_evenings), конец сессии через час
      (trigger_sessions), суббота 9:00 GMT+3 и таймеры субботы
      (trigger_weekly), шаги месячного среза (trigger_monthly). Планировщик
      v1 (молчание 9:00, полночь, итоги вс/1-е/1 янв, вечерняя рефлексия)
      остаётся и работает только со старой логикой.
    status: active
    owner: Тимур
    updated: 2026-10-14

  - id: api-anthropic
    type: service
    name: "Anthropic Claude API"
    purpose: "Генерация ответов бота — модель claude-opus-4-5"
    projects: [botik]
    access: [Тимур]
    description: "Ключ ANTHROPIC_API_KEY в Railway env."
    status: active
    owner: Тимур
    updated: 2026-09-02

  - id: jarvis
    type: service
    name: "Jarvis (AI-ассистент)"
    purpose: "AI-ассистент для команды (Тимур, Настя) — работа с документацией и планированием проекта"
    projects: [botik]
    connects_to: [repo-botik-docs]
    access: [Тимур, Настя]
    description: >
      Серверное приложение. Интерфейс — Telegram-бот bot-jarvis. Имеет
      deploy key с правом записи в repo-botik-docs (см. описание объекта).
      Хостинг и детали инфраструктуры самого Jarvis — вне области этого
      проекта (owner неизвестен / не проектный ресурс).
    status: active
    owner: Тимур
    updated: 2026-09-02

  - id: bot-jarvis
    type: telegram_bot
    name: "@ameripresso_jarvis_bot"
    hosted_on: jarvis
    purpose: "Telegram-интерфейс к Jarvis для Тимура и Насти"
    projects: [botik]
    connects_to: [jarvis]
    access: [Тимур, Настя]
    description: "Основной канал общения команды с Jarvis."
    status: active
    owner: Тимур
    updated: 2026-09-02
